[project]
name = "amazon-price-competitor-analysis"
version = "1.0.0"
description = "Amazon product price and competitor analysis tool with AI-powered insights"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.27",
    "langchain-openai>=0.3.33",
    "openai>=1.107.2",
    "python-dotenv>=1.1.1",
    "requests>=2.27.0",
    "streamlit>=1.49.1",
    "tinydb>=4.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
